name: 'Fork Verify (app-data)'
# 最小化验证: 只编译 app-data 并跑它的桌面端单元测试, 不跑全量构建.
on:
  push:
    branches: ['verify/offline-playback-fix']
  workflow_dispatch:
jobs:
  verify-app-data:
    name: 'app-data desktopTest'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 90
    steps:
      - uses: 'actions/checkout@v4'
        with:
          submodules: 'recursive'
      - name: 'Download and install JBR 21 (JetBrains)'
        env:
          JBR_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz'
          JBR_CHECKSUM_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz.checksum'
        run: |
          python .github/workflows/download_jbr.py
          mkdir -p "$HOME/jbr"
          tar -xzf "${RUNNER_TOOL_CACHE}/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz" -C "$HOME/jbr"
          JBR_HOME=$(dirname "$(find "$HOME/jbr" -maxdepth 2 -name release | head -1)")
          echo "JBR_HOME=$JBR_HOME"
          "$JBR_HOME/bin/java" -version 2>&1 | head -3
          echo "JAVA_HOME=$JBR_HOME" >> "$GITHUB_ENV"
          echo "$JBR_HOME/bin" >> "$GITHUB_PATH"
          echo "ORG_GRADLE_PROJECT_org.gradle.java.installations.paths=$JBR_HOME" >> "$GITHUB_ENV"
      - uses: 'gradle/actions/setup-gradle@v3'
      - name: 'Run app-data desktop tests'
        run: './gradlew :app:shared:app-data:desktopTest --stacktrace "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx4g" "-Dkotlin.daemon.jvm.options=-Xmx4g" "--parallel"'
